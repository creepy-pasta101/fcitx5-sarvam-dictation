[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fcitx5-sarvam-dictation"
version = "0.1.0"
description = "Dictation daemon for the Fcitx 5 Sarvam addon: audio capture and Sarvam AI speech-to-text over a Unix socket"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Suhan G Paradkar" }]
keywords = ["fcitx5", "dictation", "speech-to-text", "sarvam", "input-method"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["sarvamai>=0.1.33"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sarvam-dictation-daemon = "sarvam_dictation.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sarvam_dictation*"]
